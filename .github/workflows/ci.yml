name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Pytest
        run: uv run pytest .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

      - name: ruff format
        run: uv run ruff format --check .
